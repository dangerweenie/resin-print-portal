apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "resin-portal.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "resin-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # post-install (not pre-install) so the bundled Postgres StatefulSet already
    # exists on a fresh install; the migrate command retries the connection
    # until the database accepts it. pre-upgrade runs it before new server pods.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "resin-portal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "resin-portal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up"]
          envFrom:
            - secretRef:
                name: {{ include "resin-portal.secretName" . }}
