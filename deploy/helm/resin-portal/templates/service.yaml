apiVersion: v1
kind: Service
metadata:
  name: {{ include "resin-portal.fullname" . }}
  labels:
    {{- include "resin-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "resin-portal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
