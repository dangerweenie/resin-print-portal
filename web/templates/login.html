{{define "title"}}Sign in — Resin Print Portal{{end}}
{{define "content"}}
<div class="login-wrap">
  <div class="card">
    <h1>Resin Print Portal</h1>
    <span class="tag">Admin sign in</span>
    {{/* the error flash is rendered by base.html above the card */}}
    <form method="post" action="/admin/login">
      <input type="hidden" name="next" value="{{.Next}}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autofocus autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
{{end}}
