<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ s.printer_name }}{% endblock %}</title>
<style>
:root {
  --bg: #080808; --surface: #111; --surface2: #181818;
  --border: #252525; --text: #ddd; --muted: #666; --dim: #444;
  --accent: #ff6b35; --admin: #00c9a7; --err: #ff5555; --ok: #50fa7b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Courier New',monospace;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.tag{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-size:1rem;letter-spacing:.18em;text-transform:uppercase}
label{display:block;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:.4rem 0}
input[type=text],input[type=email],input[type=password],textarea,select{
  width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:.55rem .75rem;font-family:inherit;font-size:.85rem;border-radius:2px;outline:none;
  transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--accent)}
.btn{display:inline-block;background:var(--accent);color:#000;border:none;padding:.7rem 1.5rem;
  font-family:inherit;font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border-radius:2px;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.btn-danger{background:none;border:1px solid #440000;color:#cc3333;padding:.25rem .6rem;font-size:.7rem}
.btn-danger:hover{background:#2a0000;color:var(--err)}
.btn-admin{background:var(--admin);color:#000}
.err{background:#1a0000;border:1px solid #440000;color:var(--err);padding:.65rem .9rem;border-radius:2px;font-size:.8rem;margin-top:1rem}
.ok{background:#001a0d;border:1px solid #004422;color:var(--ok);padding:.65rem .9rem;border-radius:2px;font-size:.8rem;margin-top:1rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:2rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.mt1{margin-top:1rem}.mt2{margin-top:1.5rem}.mt3{margin-top:2rem}

/* Admin nav */
.admin-nav{background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 2rem;display:flex;align-items:center;gap:2rem}
.admin-nav .brand{color:var(--admin);font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;font-weight:700}
.admin-nav a{color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.admin-nav a:hover{color:var(--admin);text-decoration:none}
.admin-nav .logout{margin-left:auto;color:var(--dim)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{color:var(--muted);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.5rem .75rem;border-bottom:1px solid var(--border);text-align:left}
td{padding:.5rem .75rem;border-bottom:1px solid #1a1a1a;color:var(--text)}
tr:hover td{background:var(--surface2)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:2px;padding:1rem 1.25rem}
.stat .val{font-size:1.6rem;color:var(--admin);margin-bottom:.25rem}
.stat .lbl{font-size:.65rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* File rows */
.file-row{display:flex;align-items:center;justify-content:space-between;padding:.4rem .75rem;border-left:2px solid var(--border);margin:.2rem 0}
.file-row:hover{background:var(--surface2);border-left-color:var(--accent)}
.file-name{font-size:.8rem;color:var(--text)}
.file-meta{font-size:.7rem;color:var(--dim);margin-left:.5rem}
.file-actions{display:flex;align-items:center;gap:.5rem}

/* Folder header */
.folder-hdr{color:var(--accent);font-size:.85rem;margin:1.5rem 0 .5rem;display:flex;align-items:center;gap:.5rem}
.folder-hdr::before{content:'▸'}

/* Drop zone */
.dropzone{border:2px dashed var(--border);border-radius:3px;padding:2.5rem;text-align:center;
  transition:border-color .2s,background .2s;cursor:pointer;margin-top:1rem}
.dropzone:hover,.dropzone.drag-over{border-color:var(--accent);background:rgba(255,107,53,.05)}
.dropzone p{color:var(--muted);font-size:.8rem}
.dropzone .dz-icon{font-size:2rem;margin-bottom:.5rem}
.progress-bar{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:.75rem;overflow:hidden;display:none}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .2s}

/* Consent */
.rules-box{background:var(--surface2);border:1px solid var(--border);border-radius:2px;
  padding:1.25rem;font-size:.82rem;line-height:1.9;color:#aaa;white-space:pre-line;
  height:260px;overflow-y:auto;margin-top:.4rem}
.agree-row{display:flex;align-items:center;gap:.75rem;margin-top:1rem}
.agree-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.agree-lbl{font-size:.8rem;color:#aaa;margin:0;text-transform:none;letter-spacing:0}

/* Settings sections */
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:1.5rem;margin-bottom:1.25rem}
.settings-section h2{font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--admin);margin-bottom:1.25rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.toggle-row{display:flex;align-items:center;gap:1rem;margin:.5rem 0}
.toggle-row label{margin:0;text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--text)}

/* Current job banner */
.job-banner{background:linear-gradient(135deg,rgba(255,107,53,.12),rgba(255,107,53,.03));
  border:1px solid var(--accent);border-radius:3px;padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.job-banner .jb-title{color:var(--accent);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.5rem}
.job-banner .jb-file{font-size:.95rem;color:var(--text);margin-bottom:.25rem}
.job-banner .jb-meta{font-size:.75rem;color:var(--muted)}
.job-banner.overdue{border-color:var(--ok);background:linear-gradient(135deg,rgba(80,250,123,.1),rgba(80,250,123,.02))}

/* Safety checklist modal-ish inline panel */
.safety-box{background:var(--surface2);border:1px solid var(--border);border-radius:2px;padding:1rem 1.25rem;margin-top:.75rem}
.safety-item{display:flex;align-items:flex-start;gap:.6rem;margin:.55rem 0}
.safety-item input[type=checkbox]{width:16px;height:16px;margin-top:.15rem;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.safety-item label{margin:0;text-transform:none;letter-spacing:0;font-size:.8rem;color:#ccc}
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
{% block nav %}{% endblock %}
{% block content %}{% endblock %}
</body>
</html>
