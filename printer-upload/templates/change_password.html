{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem">
<div class="card" style="width:100%;max-width:420px">
  <div class="tag" style="margin-bottom:.25rem">{{ s.printer_name }}</div>
  <h1 style="color:var(--accent);margin-bottom:1rem">Set Your Password</h1>
  {% if forced %}
  <div style="font-size:.8rem;color:var(--muted);margin-bottom:1.5rem;line-height:1.6">
    This is your first login — choose a new password before continuing.
  </div>
  {% endif %}

  <form method="POST">
    <label>New Password</label>
    <input type="password" name="new_password" required autofocus>
    <div class="mt1"><label>Confirm Password</label>
    <input type="password" name="confirm_password" required></div>

    {% if err %}<div class="err">{{ err }}</div>{% endif %}

    <button class="btn mt3" type="submit" style="width:100%">Set Password →</button>
  </form>
</div>
</div>
{% endblock %}
